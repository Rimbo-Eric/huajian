<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f7ede6">
<title>花笺 · 亲手插一束花</title>
<meta name="description" content="亲手插一束花，写一句话，生成链接送给最在意的人。">
<style>
:root{
  --ink:#3a2a2d;--muted:#8f7b78;--accent:#a94a58;--accent-soft:#f6e1e3;--paper:#fffbf7;--line:rgba(90,50,55,.13);
  --serif:"Songti SC","STSong","Noto Serif SC","Noto Serif CJK SC","Source Han Serif SC","Source Han Serif CN",serif;
  --sans:-apple-system,BlinkMacSystemFont,"PingFang SC","Hiragino Sans GB","Microsoft YaHei","Noto Sans SC",sans-serif;
  --bga:#f8f1ea;--bgb:#ead9cf;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{font-family:var(--sans);color:var(--ink);background:radial-gradient(120% 80% at 50% 30%,var(--bga),var(--bgb));background-attachment:fixed;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
input,textarea{font:inherit;color:inherit}
a{color:inherit;text-decoration:none}
img{-webkit-user-drag:none;user-select:none}

/* ---------- 编辑器 ---------- */
.app{height:100vh;height:100dvh;display:flex;flex-direction:column;overflow:hidden}
.top{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 16px 4px}
.brand{display:flex;align-items:baseline;gap:10px;min-width:0}
.brand b{font-family:var(--serif);font-weight:600;font-size:22px;letter-spacing:3px}
.brand span{font-family:var(--serif);font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.acts{display:flex;gap:6px;flex-shrink:0}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:36px;padding:0 15px;border-radius:999px;font-size:13.5px;white-space:nowrap;transition:transform .15s,background .2s}
.btn:active{transform:scale(.96)}
.btn svg{width:16px;height:16px;flex-shrink:0}
.ghost{background:rgba(255,255,255,.72);box-shadow:inset 0 0 0 1px var(--line)}
.ghost:hover{background:#fff}
.primary{background:var(--accent);color:#fff;box-shadow:0 8px 18px -8px rgba(169,74,88,.75)}
.primary:hover{background:#963d4a}
@media (max-width:640px){.brand span{display:none}.acts .ghost .lbl{display:none}.acts .ghost{width:36px;padding:0}}
.work{flex:1;min-height:0;display:flex;flex-direction:column}
.stage{position:relative;flex:1;min-height:200px}
#cv{position:absolute;inset:0;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
#cv .it{cursor:grab}
.ov{position:absolute;display:flex;gap:6px;align-items:center;z-index:2}
.ov.tl{left:14px;top:6px}.ov.tr{right:14px;top:6px}.ov.bl{left:14px;bottom:10px}
.count{font-size:12px;color:var(--muted);background:rgba(255,255,255,.62);padding:5px 11px;border-radius:999px}
.ib{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.78);box-shadow:inset 0 0 0 1px var(--line);display:grid;place-items:center}
.ib svg{width:16px;height:16px}
.ib:disabled{opacity:.4;cursor:default}
.chip{height:32px;padding:0 13px;border-radius:999px;background:rgba(255,255,255,.82);box-shadow:inset 0 0 0 1px var(--line);font-size:13px}
.chip:hover{background:#fff}
.hint{position:absolute;left:50%;top:40%;transform:translate(-50%,-50%);font-family:var(--serif);color:var(--muted);font-size:14px;text-align:center;line-height:1.9;pointer-events:none;background:rgba(255,255,255,.62);padding:12px 18px;border-radius:16px;white-space:nowrap}
.loading{position:absolute;inset:0;display:grid;place-items:center;font-family:var(--serif);color:var(--muted);font-size:14px;z-index:5}
.panel{position:relative;z-index:3;background:rgba(255,251,248,.95);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-radius:22px 22px 0 0;box-shadow:0 -10px 30px -14px rgba(90,40,50,.28);padding:10px 12px calc(12px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:8px;max-height:46vh;max-height:46dvh}
@media (min-width:900px){.work{flex-direction:row}.panel{width:430px;max-height:none;border-radius:22px;margin:4px 16px 16px 0;padding:14px}}
.tabs{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
.tabs::-webkit-scrollbar{display:none}
.tabs button{flex-shrink:0;height:30px;padding:0 12px;border-radius:999px;font-size:13px;color:var(--muted)}
.tabs button.on{background:var(--ink);color:#fff}
.tabbody{overflow:auto;min-height:0;padding:2px}
.grid{display:grid;grid-auto-flow:column;grid-auto-columns:80px;gap:8px;overflow-x:auto;padding:2px 2px 6px}
@media (min-width:900px){.grid{grid-auto-flow:row;grid-template-columns:repeat(4,1fr);overflow:visible}}
.fl{display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 6px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);transition:transform .15s,box-shadow .15s}
.fl:hover{transform:translateY(-2px);box-shadow:inset 0 0 0 1px rgba(169,74,88,.35)}
.fl:active{transform:scale(.95)}
.fl img{width:58px;height:58px;object-fit:contain}
.fl span{font-size:12px}
.tip{font-size:12px;color:var(--muted);margin:6px 2px 0;line-height:1.6}
.seled{position:absolute;left:12px;right:12px;bottom:10px;max-width:440px;margin:0 auto;z-index:4;background:rgba(255,255,255,.97);border-radius:16px;box-shadow:0 12px 30px -12px rgba(90,40,50,.35),inset 0 0 0 1px var(--line);padding:10px 12px;display:flex;flex-direction:column;gap:8px;animation:pop .22s ease-out;color:#3a2a2d}
.se-h{display:flex;align-items:baseline;gap:8px}
.se-h b{font-family:var(--serif);font-size:17px}
.se-h i{font-family:var(--serif);font-size:12.5px;color:var(--accent)}
.se-h .x{margin-left:auto;color:var(--muted);font-size:20px;line-height:1;width:24px}
.sw{display:flex;gap:8px;flex-wrap:wrap}
.sw button{width:26px;height:26px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.sw button.on{outline:2px solid var(--ink);outline-offset:2px}
.se-r{display:flex;align-items:center;gap:8px;font-size:12px;color:var(--muted)}
.se-r input[type=range]{flex:1;min-width:0;accent-color:var(--accent)}
.se-b{display:flex;gap:6px}
.se-b button{flex:1;height:30px;border-radius:10px;background:#f6efeb;font-size:12.5px}
.se-b .del{color:var(--accent)}
.seg{display:inline-flex;background:#f3ebe7;border-radius:999px;padding:3px;margin-bottom:10px}
.seg button{height:28px;padding:0 14px;border-radius:999px;font-size:13px;color:var(--muted)}
.seg button.on{background:#fff;color:var(--ink);box-shadow:0 1px 4px rgba(0,0,0,.08)}
.opts{display:flex;gap:10px;flex-wrap:wrap}
.opt{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:12px;color:var(--muted);min-width:52px}
.opt i{width:50px;height:50px;border-radius:13px;display:grid;place-items:center;box-shadow:inset 0 0 0 1px rgba(0,0,0,.09);background:#fff center/cover no-repeat;overflow:hidden}
.opt i img{width:44px;height:44px;object-fit:contain}
.opt.on i{outline:2px solid var(--ink);outline-offset:2px}
.opt.on{color:var(--ink)}
.lab{font-size:12.5px;color:var(--muted);margin:12px 2px 8px}
.field{display:flex;flex-direction:column;gap:6px;margin-top:12px;font-size:12.5px;color:var(--muted);min-width:0}
.field input,.field textarea{border:0;background:#fff;box-shadow:inset 0 0 0 1px var(--line);border-radius:12px;padding:10px 12px;font-size:15px;outline:none;width:100%;resize:none;min-width:0}
.field input:focus,.field textarea:focus{box-shadow:inset 0 0 0 1.5px var(--accent)}
.fh{display:flex;justify-content:space-between;align-items:center}
.mini{font-size:12px;color:var(--accent)}

/* ---------- 弹窗 ---------- */
.modal{position:fixed;inset:0;z-index:50;display:grid;place-items:center;background:rgba(40,25,28,.34);backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{width:min(440px,100%);max-height:calc(100vh - 32px);max-height:calc(100dvh - 32px);overflow:auto;background:var(--paper);border-radius:22px;padding:22px 20px 20px;box-shadow:0 30px 60px -20px rgba(60,20,30,.45);position:relative;animation:pop .28s cubic-bezier(.2,.9,.3,1.2);color:#3a2a2d}
@keyframes pop{from{transform:translateY(16px) scale(.97);opacity:0}}
.sheet h3{font-family:var(--serif);font-size:22px;margin:0 0 4px;font-weight:600}
.sub{font-size:13px;color:#8f7b78;margin:0;line-height:1.6}
.close{position:absolute;right:12px;top:10px;font-size:24px;color:#8f7b78;width:36px;height:36px}
.langline{font-family:var(--serif);font-size:13px;color:var(--accent);background:var(--accent-soft);border-radius:10px;padding:9px 12px;margin:12px 0 0;line-height:1.6}
.row2{display:flex;gap:10px}.row2 .field{flex:1}
.wide{width:100%;height:46px;font-size:15px;margin-top:18px}
.result{margin-top:14px;padding:12px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px var(--line)}
.result b{font-size:14px}
.result input{width:100%;margin:8px 0;border:0;background:#f7f1ee;border-radius:10px;padding:9px 10px;font-size:12px;color:#8f7b78;outline:none}
.res-b{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0 8px}
.res-b .btn{flex:1}
.occ{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.occ button{height:68px;border-radius:14px;background:#fff;box-shadow:inset 0 0 0 1px var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:13.5px}
.occ button:hover{box-shadow:inset 0 0 0 1px rgba(169,74,88,.4)}
.occ em{font-style:normal;font-size:20px}
.hist{display:grid;grid-template-columns:repeat(auto-fill,minmax(124px,1fr));gap:10px;margin-top:14px}
.hcard{background:#fff;border-radius:14px;box-shadow:inset 0 0 0 1px var(--line);padding:8px;display:flex;flex-direction:column;gap:4px;font-size:12px;min-width:0}
.hcard .th{border-radius:10px;aspect-ratio:400/520;overflow:hidden}
.hcard .th svg{width:100%;height:100%;display:block}
.hcard b{font-family:var(--serif);font-size:13px}
.hcard p{margin:0;color:#8f7b78;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hcard .hb{display:flex;gap:4px}
.hcard .hb button{flex:1;height:26px;border-radius:8px;background:#f6efeb;font-size:11.5px}
.empty{color:#8f7b78;font-size:13px;text-align:center;padding:30px 0}
.img-sheet img{width:100%;border-radius:14px;margin:12px 0 4px;display:block;box-shadow:0 10px 30px -14px rgba(60,20,30,.4);-webkit-touch-callout:default;user-select:auto}
.toast{position:fixed;left:50%;bottom:calc(34px + env(safe-area-inset-bottom));transform:translateX(-50%) translateY(20px);background:rgba(45,30,33,.92);color:#fff;padding:10px 18px;border-radius:999px;font-size:13.5px;opacity:0;pointer-events:none;transition:.25s;z-index:90;white-space:nowrap}
.toast.show{opacity:1;transform:translateX(-50%)}

/* ---------- 收花页 ---------- */
.viewer{min-height:100vh;min-height:100dvh;position:relative;overflow-x:hidden;padding-bottom:20px}
.v-top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 16px;position:relative;z-index:6}
.v-top .brand b{font-size:19px}
.v-stage{position:relative;width:min(540px,100%);height:min(64vh,660px);margin:0 auto}
#vcv{width:100%;height:100%;display:block}
.pre .it,.pre .wb,.pre .wf,.pre .vf,.pre .rb,.pre .tag,.pre .gp,.pre .sb,.pre .lc{opacity:0}
.v-card{position:relative;z-index:4;width:min(440px,calc(100% - 32px));margin:-64px auto 28px;background:rgba(255,252,248,.96);border-radius:20px;padding:24px 24px 16px;box-shadow:0 24px 50px -24px rgba(80,30,40,.38);opacity:0;transform:translateY(26px);transition:opacity .9s,transform .9s cubic-bezier(.2,.8,.2,1);color:#3a2a2d}
.v-card.show{opacity:1;transform:none}
.v-to{font-family:var(--serif);font-size:19px;font-weight:600;margin-bottom:10px}
.v-msg{font-family:var(--serif);font-size:16.5px;line-height:1.95;white-space:pre-wrap;min-height:1.95em;color:#4a383a;word-break:break-word}
.v-msg .cur{display:inline-block;width:1px;height:1em;background:#a94a58;vertical-align:-2px;margin-left:1px;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
.v-from{font-family:var(--serif);font-style:italic;text-align:right;color:#8f7b78;margin-top:10px;min-height:1.4em}
.v-meta{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:14px;padding-top:12px;border-top:1px dashed rgba(90,50,55,.18);font-size:12px;color:#8f7b78}
.v-lang{color:#a94a58;font-size:12.5px;white-space:nowrap}
.v-langs{display:grid;gap:8px;margin-top:12px}
.v-langs div{display:flex;align-items:center;gap:10px;font-size:13px;color:#4a383a}
.v-langs img{width:38px;height:38px;object-fit:contain;flex-shrink:0}
.v-langs b{font-family:var(--serif);font-weight:600;margin-right:6px}
.v-acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;width:min(440px,calc(100% - 32px));margin:0 auto;opacity:0;transition:opacity .8s .3s}
.v-acts.show{opacity:1}
.cover{position:fixed;inset:0;z-index:30;display:grid;place-items:center;text-align:center;background:radial-gradient(120% 80% at 50% 30%,var(--bga),var(--bgb));transition:opacity .9s ease,transform .9s ease;padding:24px}
.cover.out{opacity:0;transform:scale(1.06);pointer-events:none}
.cv-seal img{width:110px;height:110px;object-fit:contain;animation:sway 4s ease-in-out infinite;filter:drop-shadow(0 8px 12px rgba(60,30,30,.25))}
@keyframes sway{50%{transform:rotate(6deg) translateY(-3px)}}
.cv-s{font-family:var(--serif);font-size:14px;color:var(--muted);letter-spacing:4px;margin-top:10px}
.cv-n{font-family:var(--serif);font-size:clamp(42px,13vw,72px);letter-spacing:8px;margin:12px 0 8px;font-weight:600;line-height:1.15;word-break:break-all}
.cv-f{font-family:var(--serif);font-style:italic;color:var(--muted)}
.cv-d{font-size:12.5px;color:var(--muted);margin-top:20px;letter-spacing:1px}
.cv-btn{margin-top:30px;height:48px;padding:0 34px;font-size:15.5px;animation:breath 2.4s ease-in-out infinite}
.cv-btn:disabled{opacity:.6;animation:none}
@keyframes breath{50%{transform:scale(1.05)}}
.petals{position:fixed;inset:0;pointer-events:none;z-index:5;overflow:hidden}
.petal{position:absolute;top:-30px;border-radius:70% 0 70% 0;opacity:.9;animation-name:fall;animation-timing-function:linear;animation-fill-mode:both;box-shadow:inset -2px -2px 4px rgba(0,0,0,.12)}
@keyframes fall{0%{transform:translate3d(0,0,0) rotate(0)}100%{transform:translate3d(var(--dx),112vh,0) rotate(var(--rot))}}
.dark{--ink:#f4ecef;--muted:#bdb4c6;--line:rgba(255,255,255,.18)}
.dark .ghost{background:rgba(255,255,255,.16)}
.dark .panel{--ink:#3a2a2d;--muted:#8f7b78;--line:rgba(90,50,55,.13);color:#3a2a2d}
.dark .count,.dark .chip,.dark .ib{background:rgba(255,255,255,.16)}
.dark .hint{background:rgba(255,255,255,.12)}
</style>
</head>
<body>
<svg id="gdefs" width="0" height="0" style="position:absolute;width:0;height:0" aria-hidden="true"><defs id="gdefsIn"></defs></svg>

<!-- ============ 编辑器 ============ -->
<div id="editor" class="app" hidden>
  <header class="top">
    <div class="brand"><b>花笺</b><span>亲手插一束，送给最在意的人</span></div>
    <div class="acts">
      <button class="btn ghost" id="bHist" title="送过的花"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg><span class="lbl">送过的花</span></button>
      <button class="btn ghost" id="bPreview" title="预览 ta 看到的样子"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M2 12s3.6-7 10-7 10 7 10 7-3.6 7-10 7S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg><span class="lbl">预览</span></button>
      <button class="btn ghost" id="bSave" title="保存图片"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 4v11m0 0l-4-4m4 4l4-4M5 19h14"/></svg><span class="lbl">保存图片</span></button>
      <button class="btn primary" id="bSend">送出去 →</button>
    </div>
  </header>
  <main class="work">
    <section class="stage">
      <svg id="cv" viewBox="0 0 400 520" preserveAspectRatio="xMidYMid meet"></svg>
      <div class="ov tl"><span class="count" id="count">0 枝</span></div>
      <div class="ov tr">
        <button class="ib" id="bUndo" title="撤销"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 14L4 9l5-5"/><path d="M4 9h10a6 6 0 010 12h-3"/></svg></button>
        <button class="ib" id="bClear" title="清空重来"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13"/></svg></button>
      </div>
      <div class="ov bl">
        <button class="chip" id="bRandom">✦ 随机一束</button>
        <button class="chip" id="bOcc">送花场合</button>
      </div>
      <div class="hint" id="hint">点下方的花，它就会插进花束里<br>拖动可以换位置，点一下可以换颜色</div>
      <div class="seled" id="seled" hidden></div>
    </section>
    <section class="panel">
      <nav class="tabs" id="tabs"></nav>
      <div class="tabbody" id="tabbody"></div>
    </section>
  </main>
</div>

<!-- ============ 收花页 ============ -->
<div id="viewer" class="viewer" hidden>
  <div class="v-top">
    <div class="brand"><b>花笺</b></div>
    <button class="btn ghost" id="vReplay" hidden>再开一次</button>
  </div>
  <div class="v-stage"><svg id="vcv" viewBox="0 0 400 520" preserveAspectRatio="xMidYMid meet" class="pre"></svg></div>
  <div class="v-card" id="vcard">
    <div class="v-to" id="vTo"></div>
    <div class="v-msg" id="vMsg"></div>
    <div class="v-from" id="vFrom"></div>
    <div class="v-meta"><span id="vDate"></span><button class="v-lang" id="vLangBtn">这束花的花语 ›</button></div>
    <div class="v-langs" id="vLangs" hidden></div>
  </div>
  <div class="v-acts" id="vActs">
    <button class="btn ghost" id="vSave">保存图片</button>
    <button class="btn primary" id="vReply">也送 ta 一束</button>
  </div>
  <div class="cover" id="cover">
    <div>
      <div class="cv-seal" id="cvSeal"></div>
      <div class="cv-s">今天的花，送给</div>
      <div class="cv-n" id="cvName"></div>
      <div class="cv-f" id="cvFrom"></div>
      <div class="cv-d" id="cvDate"></div>
      <button class="btn primary cv-btn" id="cvOpen" disabled>花正在路上…</button>
    </div>
  </div>
</div>
<div class="petals" id="petals"></div>

<!-- ============ 弹窗 ============ -->
<div class="modal" id="mSend" hidden><div class="sheet">
  <button class="close" data-close>×</button>
  <h3>送出你的花束</h3>
  <p class="sub">写几句话，生成一个链接。ta 点开的时候，花会一朵一朵为 ta 开。</p>
  <div class="langline" id="sLang"></div>
  <div class="row2">
    <label class="field">送给<input id="sTo" maxlength="16" placeholder="ta 的名字"></label>
    <label class="field">署名<input id="sFrom" maxlength="16" placeholder="你的名字"></label>
  </div>
  <label class="field"><span class="fh">想说的话<button type="button" class="mini" id="sIdea">换一句灵感</button></span><textarea id="sMsg" rows="3" maxlength="240" placeholder="今天也很想你。"></textarea></label>
  <div class="row2">
    <label class="field">日期<input id="sDate" type="date"></label>
    <label class="field">在一起的第一天（选填）<input id="sStart" type="date"></label>
  </div>
  <button class="btn primary wide" id="sGo">生成礼物链接</button>
  <div class="result" id="sRes" hidden>
    <b>链接已生成 ✓</b>

/* 花束圆顶的大小跟着主花的总面积走：花少就小巧，花多就饱满；包装纸跟着一起缩放 */
function geo(st){const m=st.box.m;let A=0,n=0;
 for(const it of st.items){const d=T[it.t];if(d&&d.k==='main'){A+=(d.R*it.s)**2;n++;}}
 const rx=n?clamp(Math.sqrt(A)*.92,58,150):110,ry=rx*.82,s=clamp(rx/120,.6,1.25);
 // 圆顶中心固定：加花时花束向外长，已经插好的花不会被挤到包装纸外面

 if(m==='v'){const cy=255-Math.max(0,ry-80)*.5;return{m,cx:200,cy,rx,ry,tx:200,ty:470,s,vTop:cy+ry*.6};}

/* 从圆顶中心往外的方向（用于侧面花和配叶朝外伸） */

/* 一枝花在画面里的样子：用哪张素材、多大、怎么转 */

 }

 const L=def.L*it.s*clamp(g.rx/125,.55,1.05)*(k==='filler'?.82:.95),kk=L/(m.h*m.ay),w=m.w*kk,h=m.h*kk;
 return{id:base,w,h,ox:-m.ax*w,oy:-m.ay*h,rot:sprigRot(it.x,it.y,it,g),f:m.sh?'':'dsS',len:L,flip:(v>>1)%2===1};
}

function bedSVG(g,st){const ids=['ru_italian','eu_dollar'].filter(i=>MAN[i]);if(!ids.length)return '';
 const n=st.box.m==='w'?8:11,L=Math.max(g.rx,g.ry)*1.08;let s='';
 for(let i=0;i<n;i++){const ang=(st.box.m==='w'?-200+i*(220/(n-1)):-180+i*360/n+12),a=ang*Math.PI/180;

  s+=`<g transform="translate(${F(x)} ${F(y)}) rotate(${F(ang+90)})"><image href="${href(id)}" x="${F(-m.ax*w)}" y="${F(-m.ay*h)}" width="${F(w)}" height="${F(h)}" preserveAspectRatio="none"${fAttr(m.sh?'':'dsS')}/></g>`;}
 return `<g class="lc">${s}</g>`;}

/* 包装纸：按花束圆顶的实际轮廓生成。后片在花的外缘露出几个纸角，前片从下往上包住花束 */

function crown(g,angs,fPeak,fVal,half){const pts=angs.map((a,i)=>domePt(g,a,i%2?fVal:fPeak));

 return d+`L${F(200+half)} ${g.ty}Z`;}

const ORDER={green:0,filler:1,main:2};
const angOf=(x,y,g)=>Math.atan2((y-g.cy)/g.ry,(x-g.cx)/g.rx)*180/Math.PI;
const angDiff=(a,b)=>Math.abs(((a-b)%360+540)%360-180);
function placeItem(it,st,rand,gFix){
 const def=T[it.t],g=gFix||geo(st),k=def.k;let best=[g.cx,g.cy],bs=-Infinity;
 const others=st.items.filter(o=>o!==it&&T[o.t]&&o.placed!==false);
 for(let i=0;i<160;i++){let x,y,pen=0;
  if(k==='main'){const a=rand()*Math.PI*2,rr=Math.sqrt(rand()),sa=Math.sin(a);x=g.cx+Math.cos(a)*rr*g.rx*(1-.38*Math.max(0,sa)*rr);y=g.cy+sa*rr*g.ry;
   if(g.m==='w'&&y>g.cy+g.ry*.6)y=g.cy+g.ry*.6-rand()*10;
   const rN=def.R*it.s;for(const o of others){if(T[o.t].k!=='main')continue;const d=Math.hypot(o.x-x,o.y-y),ov=(T[o.t].R*o.s+rN)*.62-d;if(ov>0)pen+=ov*ov;}pen+=rr*rr*rN*3.4;}
  else{// 配花/配叶：沿圆顶上半圈（左侧 → 顶部 → 右侧）均匀散开
   const ang=-200+rand()*220,a=ang*Math.PI/180,rr=k==='filler'?.38+rand()*.34:.42+rand()*.3;x=g.cx+Math.cos(a)*rr*g.rx;y=g.cy+Math.sin(a)*rr*g.ry;
   for(const o of others){const ko=T[o.t].k;if(ko==='main')continue;const da=angDiff(ang,angOf(o.x,o.y,g)),need=(ko===k?(k==='green'?40:34):18)-da;if(need>0)pen+=need*need*(ko===k?1:.5);}}
  const sc=-pen+rand()*8;if(sc>bs){bs=sc;best=[x,y];}}
 it.x=clamp(best[0],24,376);it.y=clamp(best[1],50,g.ty-50);
}
function insertItem(st,it){const g=geo(st),ko=ORDER[T[it.t].k];let idx;

 else{const d=dd(it,g);idx=st.items.findIndex(o=>T[o.t].k==='main'&&dd(o,g)<d);if(idx<0)idx=st.items.length;}

function buildMix(st,list){

 for(const [t,ck,n] of list){if(!T[t])continue;let ci=T[t].cs.findIndex(x=>x[0]===ck);if(ci<0)ci=0;if(!MAN[`${t}_${T[t].cs[ci][0]}`])continue;for(let i=0;i<n;i++)all.push({t,c:ci});}
 const mains=all.filter(a=>T[a.t].k==='main').sort((a,b)=>T[b.t].R-T[a.t].R);
 const ordered=shuffle(mains.slice(0,Math.ceil(mains.length/2))).concat(shuffle(mains.slice(Math.ceil(mains.length/2)))).concat(shuffle(all.filter(a=>T[a.t].k==='filler'))).concat(shuffle(all.filter(a=>T[a.t].k==='green')));
 for(const a of ordered){const k=T[a.t].k;st.items.push({id:nextId++,t:a.t,c:a.c,s:k==='main'?.94+Math.random()*.12:.9+Math.random()*.2,r:k==='main'?Math.round((Math.random()-.5)*40):Math.round((Math.random()-.5)*8),v:Math.floor(Math.random()*100),x:0,y:0,placed:false});}
 const gF=geo(st);for(const it of st.items){placeItem(it,st,Math.random,gF);it.placed=true;}

}

function enc(obj){const bytes=new TextEncoder().encode(JSON.stringify(obj));let bin='';for(let i=0;i<bytes.length;i+=4096)bin+=String.fromCharCode.apply(null,bytes.subarray(i,i+4096));return btoa(bin).replace(/\+/g,'-').replace(/\//g,'_').replace(/=+$/,'');}
function dec(str){str=decodeURIComponent(str).replace(/-/g,'+').replace(/_/g,'/');while(str.length%4)str+='=';const bin=atob(str);const bytes=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)bytes[i]=bin.charCodeAt(i);return JSON.parse(new TextDecoder().decode(bytes));}

  g.fillStyle='#a08e8a';g.font=`28px ${SANS}`;g.fillText(fmtDate(card.d)+(card.n?` · 第 ${card.n} 天`:''),x,fy);

 }

let S,nextId=1,sel=null,undoStack=[],tab='main',drag=null,pendingMsg='';
const lastColor={};
const newState=()=>({items:[],box:{m:'w',w:0,h:0,v:0},rb:4,tg:'',bg:0});
function snap(){undoStack.push(JSON.stringify(S));if(undoStack.length>60)undoStack.shift();$('#bUndo').disabled=false;}
function undo(){if(!undoStack.length)return;S=JSON.parse(undoStack.pop());if(sel!=null&&!S.items.some(i=>i.id===sel))sel=null;$('#bUndo').disabled=!undoStack.length;applyBg(S.bg);drawStage();renderTab();save();}
function save(){store.set('hj2.draft',{S,nextId});}
const selItem=()=>S.items.find(i=>i.id===sel);

function drawStage(){

/* 只换选中圈，不重绘整束花（避免图片重新解码时闪一下） */
function setSel(id){sel=id;const old=$('#selr');if(old)old.remove();const it=selItem();
 if(it){const q=selRing(it,S,geo(S));if(q)$('#cv').insertAdjacentHTML('beforeend',`<circle id="selr" cx="${F(q.x)}" cy="${F(q.y)}" r="${F(q.r)}" fill="none" stroke="#a94a58" stroke-width="1.4" stroke-dasharray="4 3" pointer-events="none"/>`);}
 renderSel();}
function updateItemDom(it){const g=geo(S);const el=$(`#cv .it[data-id="${it.id}"]`);
 if(el){const sp=sprite(it,S,g),im=el.querySelector('image');
  if(sp&&im){el.setAttribute('transform',`translate(${F(it.x)} ${F(it.y)}) rotate(${F(sp.rot)})`);const h=href(sp.id);if(im.getAttribute('href')!==h)im.setAttribute('href',h);
   im.setAttribute('x',F(sp.ox));im.setAttribute('y',F(sp.oy));im.setAttribute('width',F(sp.w));im.setAttribute('height',F(sp.h));if(sp.f)im.setAttribute('filter',`url(#${sp.f})`);else im.removeAttribute('filter');
   const c=el.querySelector('circle');if(c)c.setAttribute('r',F(sp.hr));}
  else el.outerHTML=itemSVG(it,S,g);}
 const r=$('#selr');if(r&&it.id===sel){const q=selRing(it,S,g);if(q){r.setAttribute('cx',F(q.x));r.setAttribute('cy',F(q.y));r.setAttribute('r',F(q.r));}}}

function renderSel(){
 const box=$('#seled'),it=selItem();$('.ov.bl').hidden=!!it;
 if(!it){box.hidden=true;box.innerHTML='';box._it=null;return;}
 const def=T[it.t],same=!box.hidden&&box._it===it;box.hidden=false;box._it=it;
 if(same){$$('.sw button',box).forEach(b=>b.classList.toggle('on',+b.dataset.c===it.c));return;}
 box.innerHTML=`<div class="se-h"><b>${def.n}</b><i>${def.lang}</i><button class="x" id="seX" title="收起">×</button></div>
 ${def.cs.length>1?`<div class="sw">${def.cs.map((cc,i)=>`<button data-c="${i}" class="${i===it.c?'on':''}" title="${cc[1]}" style="background:radial-gradient(circle at 35% 30%,${mix(cc[2],'#ffffff',.35)},${cc[2]} 60%,${mix(cc[2],'#000000',.25)})"></button>`).join('')}</div>`:''}
 <div class="se-r">大小<input type="range" id="seS" min="60" max="150" value="${Math.round(it.s*100)}">角度<input type="range" id="seR" min="-60" max="60" value="${it.r||0}"></div>
 <div class="se-b"><button id="seUp">放到最前</button><button id="seDup">再来一枝</button><button class="del" id="seDel">移除</button></div>`;
 $('#seX').onclick=()=>setSel(null);
 $$('.sw button',box).forEach(b=>b.onclick=()=>{snap();it.c=+b.dataset.c;lastColor[it.t]=it.c;drawStage();save();});
 for(const [id,key,div] of [['#seS','s',100],['#seR','r',1]]){const inp=$(id,box);
  inp.addEventListener('pointerdown',snap);inp.addEventListener('keydown',snap,{once:true});

 $('#seUp').onclick=()=>{snap();const k=T[it.t].k;S.items=S.items.filter(i=>i!==it);let idx=S.items.findIndex(o=>ORDER[T[o.t].k]>ORDER[k]);if(idx<0)idx=S.items.length;S.items.splice(idx,0,it);drawStage();save();};

function addFlower(t,ci){

 const it={id:nextId++,t,c:ci??lastColor[t]??0,s:def.k==='main'?.95+Math.random()*.1:.95+Math.random()*.1,r:def.k==='main'?Math.round((Math.random()-.5)*40):0,v:Math.floor(Math.random()*100),x:0,y:0,placed:false};

  +`<label class="field">吊牌上写点什么（选填，会挂在丝带上）<input id="tgIn" maxlength="14" placeholder="例如：To 小雨 / Day 128" value="${esc(S.tg)}"></label>`);
  const inp=$('#tgIn');if(inp){inp.addEventListener('focus',snap,{once:true});inp.addEventListener('input',()=>{S.tg=inp.value.trim();drawStage();save();});}

function bindEditor(){
 const cv=$('#cv');
 const pt=e=>{const p=cv.createSVGPoint();p.x=e.clientX;p.y=e.clientY;return p.matrixTransform(cv.getScreenCTM().inverse());};
 cv.addEventListener('pointerdown',e=>{
  const gEl=e.target.closest('.it');
  if(!gEl){if(sel!=null)setSel(null);return;}
  const id=+gEl.dataset.id,it=S.items.find(i=>i.id===id);if(!it)return;
  const p=pt(e);drag={it,ox:it.x-p.x,oy:it.y-p.y,sx:e.clientX,sy:e.clientY,moved:false};
  try{cv.setPointerCapture(e.pointerId);}catch(_){}
  if(sel!==id)setSel(id);
  e.preventDefault();
 });
 let raf=0;
 cv.addEventListener('pointermove',e=>{
  if(!drag)return;
  if(!drag.moved){if(Math.hypot(e.clientX-drag.sx,e.clientY-drag.sy)<4)return;drag.moved=true;snap();}
  const p=pt(e),g=geo(S);drag.it.x=clamp(p.x+drag.ox,24,376);drag.it.y=clamp(p.y+drag.oy,40,g.ty-40);
  if(!raf)raf=requestAnimationFrame(()=>{raf=0;if(drag)updateItemDom(drag.it);});
 });
 const end=()=>{if(drag){if(drag.moved){updateItemDom(drag.it);save();}drag=null;}};
 cv.addEventListener('pointerup',end);cv.addEventListener('pointercancel',end);

 $('#tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;renderTab();});
 $('#tabbody').addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;const d=b.dataset;
  if(d.t){addFlower(d.t);return;}
  if(d.m){if(S.box.m===d.m)return;snap();const old=geo(S);S.box.m=d.m;const g=geo(S);for(const it of S.items){it.x+=g.cx-old.cx;it.y+=g.cy-old.cy;}}
  else if(d.w!==undefined){snap();S.box.w=+d.w;}
  else if(d.h!==undefined){snap();S.box.h=+d.h;}
  else if(d.v!==undefined){snap();S.box.v=+d.v;}
  else if(d.rb!==undefined){snap();S.rb=+d.rb;}
  else if(d.bg!==undefined){snap();S.bg=+d.bg;applyBg(S.bg);}
  else return;
  renderTab();drawStage();save();
 });

 $('#bClear').onclick=()=>{if(!S.items.length)return;snap();S.items=[];sel=null;drawStage();save();toast('已清空，点撤销可以找回');};

function randomBouquet(){
 snap();const R=Math.random,sc=pick(SCHEMES);const list=[];
 const nMain=10+Math.floor(R()*5);for(let i=0;i<nMain;i++){const [t,ck]=pick(sc.mains);list.push([t,ck,T[t].R>40&&list.filter(x=>x[0]===t).length>=2?0:1]);}
 for(const [t,ck] of sc.fill)list.push([t,ck,2+Math.floor(R()*2)]);
 for(const [t,ck] of sc.green)list.push([t,ck,2+Math.floor(R()*2)]);
 const r=R();if(r<.6)S.box={m:'w',w:Math.floor(R()*WRAPS.length),h:S.box.h|0,v:S.box.v|0};else if(r<.85)S.box={m:'h',w:S.box.w|0,h:Math.floor(R()*HANDS.length),v:S.box.v|0};else S.box={m:'v',w:S.box.w|0,h:S.box.h|0,v:Math.floor(R()*VASES.length)};
 S.rb=S.box.m==='h'&&S.box.h===0?-1:Math.floor(R()*BOWS.length);S.bg=Math.floor(R()*(BGS.length-1));applyBg(S.bg);
 buildMix(S,list.filter(x=>x[2]>0));sel=null;renderTab();drawStage();save();
}

 const types=bouquetTypes(st).reverse();
 $('#vLangs').innerHTML=types.map(t=>{const it=st.items.find(i=>i.t===t);return `<div><img src="${thumb(t,it?it.c:0)}" alt=""><span><b>${T[t].n}</b>${T[t].lang}</span></div>`;}).join('');
 $('#vLangBtn').onclick=()=>{const l=$('#vLangs');l.hidden=!l.hidden;$('#vLangBtn').textContent=l.hidden?'这束花的花语 ›':'收起花语';};
 const svg=$('#vcv');
 const card={to:g.to,m:g.m,f:g.f,d:g.d,n:g.n};
 $('#vSave').onclick=()=>saveImage(st,card);
 $('#vReply').onclick=()=>{location.href=baseURL()+'#r='+enc({to:g.f||'',f:g.to||''});setTimeout(()=>location.reload(),30);};
 $('#vReply').hidden=!g.f;
 $('#vReplay').onclick=()=>play(svg,st,g,true);
 preload(usedAssets(st).concat(['petal_red','petal_pink','petal_white'].filter(i=>MAN[i]))).then(()=>{svg.innerHTML=bouquetSVG(st,{inner:true});const b=$('#cvOpen');b.disabled=false;b.textContent='打开看看';
  if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname)&&readParam('auto'))setTimeout(()=>b.click(),300);});
 $('#cvOpen').onclick=()=>{$('#cover').classList.add('out');setTimeout(()=>{$('#cover').hidden=true;},900);setTimeout(()=>play(svg,st,g,false),250);};
}
let typing=null;
function play(svg,st,g,replay){
 const card=$('#vcard');card.classList.remove('show');$('#vActs').classList.remove('show');$('#vReplay').hidden=true;
 if(replay){svg.innerHTML=bouquetSVG(st,{inner:true});window.scrollTo({top:0,behavior:'smooth'});}
 $('#vMsg').textContent='';clearInterval(typing);
 const colors=st.items.filter(i=>T[i.t].k==='main').map(i=>(T[i.t].cs[i.c]||T[i.t].cs[0])[2]);
 bloom(svg,st,()=>{
  card.classList.add('show');
  const chars=[...(g.m||'')];let i=0;const msg=$('#vMsg');const cur='<span class="cur"></span>';const step=chars.length>80?28:65;
  typing=setInterval(()=>{i++;msg.innerHTML=esc(chars.slice(0,i).join(''))+(i<chars.length?cur:'');if(i>=chars.length){clearInterval(typing);setTimeout(()=>{$('#vActs').classList.add('show');$('#vReplay').hidden=false;},300);}},step);
  if(!chars.length){clearInterval(typing);$('#vActs').classList.add('show');$('#vReplay').hidden=false;}
 },()=>{const cs=colors.length?colors:['#efa3b3'];petals(cs,30,false);petals(cs,8,true);});
}
function bloom(svg,st,onDone,onPetals){
 svg.classList.add('pre');
 requestAnimationFrame(()=>{
  svg.classList.remove('pre');
  const A=(el,kf,opt)=>el&&el.animate?el.animate(kf,Object.assign({fill:'backwards',easing:'cubic-bezier(.22,.8,.24,1)'},opt)):null;
  const up=[{opacity:0,transform:'translateY(26px) scale(.94)'},{opacity:1,transform:'none'}];
  $$('.wb,.vf,.sb',svg).forEach(el=>A(el,up,{duration:800}));
  $$('.wf',svg).forEach(el=>A(el,up,{duration:800,delay:140}));
  $$('.gp',svg).forEach(el=>A(el,[{opacity:0},{opacity:1}],{duration:900,delay:200}));
  $$('.lc',svg).forEach(el=>A(el,[{opacity:0},{opacity:0,offset:.35},{opacity:1}],{duration:2600,delay:400,easing:'ease-in'}));
  let t=420,firstMain=-1;
  const els=[...$$('.gs .it',svg),...$$('.fs .it',svg),...$$('.hs .it',svg)];
  for(const el of els){
   const it=st.items.find(i=>i.id===+el.dataset.id);if(!it)continue;const k=T[it.t].k;const bl=el.firstElementChild;
   if(k==='main'){if(firstMain<0)firstMain=t;A(bl,[{opacity:0,transform:'scale(.15) rotate(-28deg)'},{opacity:1,transform:'scale(1.06) rotate(3deg)',offset:.65},{opacity:1,transform:'scale(1) rotate(0deg)'}],{duration:950,delay:t});t+=150;}
   else{A(bl,[{opacity:0,transform:'scale(.4) rotate(-10deg)'},{opacity:1,transform:'scale(1) rotate(0deg)'}],{duration:800,delay:t});t+=k==='filler'?80:60;}
  }
  const end=t+800;
  $$('.rb',svg).forEach(el=>A(el,[{opacity:0,transform:'scale(0)'},{opacity:1,transform:'scale(1.1)',offset:.7},{opacity:1,transform:'scale(1)'}],{duration:650,delay:end-650}));
  $$('.tag',svg).forEach(el=>A(el,[{opacity:0,transform:'rotate(-28deg)'},{opacity:1,transform:'rotate(9deg)',offset:.45},{opacity:1,transform:'rotate(-4deg)',offset:.75},{opacity:1,transform:'rotate(0deg)'}],{duration:1300,delay:end-300}));
  setTimeout(onPetals,(firstMain<0?600:firstMain)+500);
  setTimeout(onDone,end+150);
 });
}
function petalAsset(hex){const n=parseInt(hex.slice(1),16),r=(n>>16)&255,g=(n>>8)&255,b=n&255,l=(r*.3+g*.59+b*.11)/255;
 const id=l>.78?'petal_white':(r>g*1.6&&r>b*1.4&&l<.5)?'petal_red':(r>=b?'petal_pink':'petal_white');return MAN[id]?id:null;}
function petals(colors,n,loop){
 const box=$('#petals');
 for(let i=0;i<n;i++){const cc=colors[i%colors.length],sz=.65+Math.random()*.75,pa=petalAsset(cc);
  const d=document.createElement(pa?'img':'i');d.className='petal';
  if(pa){d.src=ASSET+MAN[pa].f;d.alt='';}
  d.style.cssText=`left:${Math.random()*100}vw;width:${(pa?20:12)*sz}px;height:${(pa?20*MAN[pa].h/MAN[pa].w:15)*sz}px;${pa?'border-radius:0;box-shadow:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.18));':`background:linear-gradient(135deg,${mix(cc,'#ffffff',.3)},${cc});`}animation-duration:${(loop?8:5)+Math.random()*5}s;animation-delay:${Math.random()*(loop?10:1.8)}s;${loop?'animation-iteration-count:infinite;':''}--dx:${((Math.random()-.5)*200).toFixed(0)}px;--rot:${(Math.random()*720-360).toFixed(0)}deg`;
  if(!loop)d.addEventListener('animationend',()=>d.remove());box.appendChild(d);}
}

/* ================= 启动 ================= */
async function boot(){
 MAN=window.__MANIFEST__||{};
 if(!Object.keys(MAN).length){try{MAN=await (await fetch(ASSET+'manifest.json',{cache:'no-cache'})).json();}catch(e){MAN={};}}
 if(!Object.keys(MAN).length)toast('花材素材没加载出来，检查一下 assets 文件夹是否和页面放在一起');
 $('#gdefsIn').innerHTML=defsStr();
 const gp=readParam('g');
 if(gp){try{const g=dec(gp);if(g&&Array.isArray(g.i)){initViewer(g);return;}}catch(e){console.error(e);}toast('这个链接好像不完整，先帮你打开插花台');}
 initEditor();
}
window.addEventListener('hashchange',()=>{if(readParam('g'))location.reload();});
if(/^(localhost|127\.0\.0\.1)$/.test(location.hostname))window.__hj={OCC,SCHEMES,buildMix,renderPNG,compact,enc,newState,get S(){return S;},set S(v){S=v;},drawStage,applyBg,renderTab,randomBouquet:()=>randomBouquet()};
boot();
})();
